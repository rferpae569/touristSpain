<div class="slider-frame">
  <ul
    [style.transform]="'translateX(-' + indiceActual * 100 + '%)'"
    [style.transition]="
      imagenes.length > 1 ? 'transform 1s ease-in-out' : 'none'
    "
  >
    <li *ngFor="let imagen of imagenes">
      <img [src]="imagen.src" [alt]="imagen.alt" />
    </li>
  </ul>
</div>
